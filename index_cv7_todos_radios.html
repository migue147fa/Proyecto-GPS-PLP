const z=zonas.CV7;
const capas=[];
for(const poly of z.personal){
  capas.push(L.polygon(poly,{color:'#ff3333',weight:3,fillColor:'#ff3333',fillOpacity:.13})
    .addTo(map).bindPopup('Radio Personal - CV7'));
}
for(const poly of z.equipos){
  capas.push(L.polygon(poly,{color:'#1e88ff',weight:3,fillColor:'#1e88ff',fillOpacity:.26})
    .addTo(map).bindPopup('Radio Equipos - CV7'));
}
map.fitBounds(L.featureGroup(capas).getBounds(),{padding:[25,25]});

let gpsMarker=null,watchId=null,ultimaZona='';

function puntoEnPoligono(point,poly){
 const x=point[1],y=point[0];let inside=false;
 for(let i=0,j=poly.length-1;i<poly.length;j=i++){
   const xi=poly[i][1],yi=poly[i][0],xj=poly[j][1],yj=poly[j][0];
   const inter=((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi);
   if(inter) inside=!inside;
 }
 return inside;
}
function distanciaSegmentoMetros(p,a,b){
 const lat0=p[0]*Math.PI/180,mLat=111132.92,mLon=111412.84*Math.cos(lat0);
 const ax=(a[1]-p[1])*mLon,ay=(a[0]-p[0])*mLat,bx=(b[1]-p[1])*mLon,by=(b[0]-p[0])*mLat;
 const vx=bx-ax,vy=by-ay,vv=vx*vx+vy*vy;
 let t=vv===0?0:-(ax*vx+ay*vy)/vv;t=Math.max(0,Math.min(1,t));
 const cx=ax+t*vx,cy=ay+t*vy;return Math.sqrt(cx*cx+cy*cy);
}
function distanciaAlBorde(p,poly){
 if(puntoEnPoligono(p,poly)) return 0;
 let min=Infinity;
 for(let i=0;i<poly.length;i++) min=Math.min(min,distanciaSegmentoMetros(p,poly[i],poly[(i+1)%poly.length]));
 return min;
}

function dentroDeAlguno(p,polys){
  return polys.some(poly=>puntoEnPoligono(p,poly));
}
function distanciaAConjunto(p,polys){
  if(dentroDeAlguno(p,polys)) return 0;
  let min=Infinity;
  for(const poly of polys) min=Math.min(min,distanciaAlBorde(p,poly));
  return min;
}
function sonar(tipo){
 if(ultimaZona===tipo)return;ultimaZona=tipo;
 try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const osc=ctx.createOscillator();const gain=ctx.createGain();
 osc.frequency.value=tipo==='equipos'?1050:760;gain.gain.value=.22;osc.connect(gain);gain.connect(ctx.destination);osc.start();
 setTimeout(()=>{osc.stop();ctx.close()},tipo==='equipos'?1100:700)}catch(e){}
 if(navigator.vibrate)navigator.vibrate(tipo==='equipos'?[500,150,500,150,500]:[300,150,300]);
}
function actualizar(lat,lon){
 const p=[lat,lon];
 if(gpsMarker)map.removeLayer(gpsMarker);
 gpsMarker=L.circleMarker(p,{radius:9,color:'#fff',weight:3,fillColor:'#22a7ff',fillOpacity:1}).addTo(map);
 const inEq=dentroDeAlguno(p,z.equipos),inPe=dentroDeAlguno(p,z.personal);
 document.getElementById('coords').textContent='Lat: '+lat.toFixed(7)+' | Lon: '+lon.toFixed(7);
 document.getElementById('distEquipos').textContent='Distancia al límite de maquinarias: '+Math.round(distanciaAConjunto(p,z.equipos))+' m';
 document.getElementById('distPersonal').textContent='Distancia al límite de personal: '+Math.round(distanciaAConjunto(p,z.personal))+' m';
 const est=document.getElementById('estado'),det=document.getElementById('detalle');
 if(inEq){est.className='estado danger';est.textContent='PELIGRO - RADIO DE MAQUINARIAS';det.textContent='Te encuentras dentro del radio de maquinarias CV7.';sonar('equipos')}
 else if(inPe){est.className='estado warn';est.textContent='ALERTA - RADIO DE PERSONAL';det.textContent='Te encuentras dentro del radio de personal CV7.';sonar('personal')}
 else{est.className='estado ok';est.textContent='FUERA DE ZONA';det.textContent='Estás fuera de los radios de CV7.';ultimaZona=''}
}
function usarGPS(){
 if(!navigator.geolocation){alert('Tu navegador no soporta geolocalización.');return}
 if(watchId!==null)navigator.geolocation.clearWatch(watchId);
 watchId=navigator.geolocation.watchPosition(pos=>{actualizar(pos.coords.latitude,pos.coords.longitude);map.setView([pos.coords.latitude,pos.coords.longitude],17)},
 ()=>alert('No se pudo obtener el GPS. Revisa permisos de ubicación y que la página use HTTPS.'),
 {enableHighAccuracy:true,maximumAge:0,timeout:15000});
}
function centroid(poly){let lat=0,lon=0;for(const p of poly){lat+=p[0];lon+=p[1]}return[lat/poly.length,lon/poly.length]}
function probarDentro(){const p=centroid(z.equipos[0]);actualizar(p[0],p[1]);map.setView(p,17)}

function puntoEnPoligono(point, polygon){
  const x=point[1], y=point[0];
  let dentro=false;
  for(let i=0,j=polygon.length-1;i<polygon.length;j=i++){
    const xi=polygon[i][1], yi=polygon[i][0];
    const xj=polygon[j][1], yj=polygon[j][0];
    const intersecta=((yi>y)!=(yj>y)) &&
      (x < (xj-xi)*(y-yi)/(yj-yi)+xi);
    if(intersecta) dentro=!dentro;
  }
  return dentro;
}

// Distancia mínima desde el GPS al perímetro de un polígono.
// Proyecta localmente lat/lon a metros y mide contra cada segmento del borde.
function distanciaAlLimite(point, polygon){
  const R=6371000;
  const lat0=point[0]*Math.PI/180;

  function xy(p){
    return [
      (p[1]-point[1])*Math.PI/180*R*Math.cos(lat0),
      (p[0]-point[0])*Math.PI/180*R
    ];
  }

  let min=Infinity;
  for(let i=0;i<polygon.length;i++){
    const a=xy(polygon[i]);
    const b=xy(polygon[(i+1)%polygon.length]);
    const abx=b[0]-a[0], aby=b[1]-a[1];
    const den=abx*abx+aby*aby;
    let t=den===0 ? 0 : (-(a[0]*abx+a[1]*aby))/den;
    t=Math.max(0,Math.min(1,t));
    const qx=a[0]+t*abx, qy=a[1]+t*aby;
    const d=Math.hypot(qx,qy);
    if(d<min) min=d;
  }
  return min;
}

function zonaMasCercana(point, tipo){
  let mejor={nombre:null, distancia:Infinity, dentro:false};
  for(const [nombre,z] of Object.entries(zonas)){
    const pol=z[tipo];
    const d=distanciaAlLimite(point,pol);
    const dentro=puntoEnPoligono(point,pol);
    if(d<mejor.distancia) mejor={nombre,distancia:d,dentro};
  }
  return mejor;
}

function zonasDondeEsta(point,tipo){
  const r=[];
  for(const [nombre,z] of Object.entries(zonas)){
    if(puntoEnPoligono(point,z[tipo])) r.push(nombre);
  }
  return r;
}

function prepararAudio(){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
  }catch(e){}
}

function alarma(tipo){
  if(alarmaZona===tipo) return;
  alarmaZona=tipo;

  try{
    prepararAudio();
    if(audioCtx){
      const osc=audioCtx.createOscillator();
      const gain=audioCtx.createGain();
      osc.type='sine';
      osc.frequency.value = tipo==='equipos' ? 1100 : (tipo==='personal' ? 850 : 650);
      gain.gain.value=.20;
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + (tipo==='proximidad' ? .55 : 1.05));
    }
  }catch(e){}

  if(navigator.vibrate){
    if(tipo==='equipos') navigator.vibrate([500,150,500,150,500]);
    else if(tipo==='personal') navigator.vibrate([400,150,400]);
    else navigator.vibrate([220,120,220]);
  }
}

function actualizar(lat,lon,centrar=false){
  const p=[lat,lon];
  ultimaPosicion=p;

  if(marker){
    marker.setLatLng(p);
  }else{
    marker=L.circleMarker(p,{
      radius:8,color:'#fff',weight:3,fillColor:'#2196f3',fillOpacity:1
    }).addTo(map).bindPopup('Ubicación GPS actual');
  }

  if(primerGPS || centrar){
    map.setView(p,17);
    primerGPS=false;
  }

  const dentroEquipos=zonasDondeEsta(p,'equipos');
  const dentroPersonal=zonasDondeEsta(p,'personal');
  const cercaEquipos=zonaMasCercana(p,'equipos');
  const cercaPersonal=zonaMasCercana(p,'personal');

  document.getElementById('coords').textContent=
    'Lat: '+lat.toFixed(7)+' | Lon: '+lon.toFixed(7);

  document.getElementById('distEquipos').textContent=
    'Distancia al límite de maquinarias ('+cercaEquipos.nombre+'): '+Math.round(cercaEquipos.distancia)+' m';

  document.getElementById('distPersonal').textContent=
    'Distancia al límite de personal ('+cercaPersonal.nombre+'): '+Math.round(cercaPersonal.distancia)+' m';

  const estado=document.getElementById('estado');
  const detalle=document.getElementById('detalle');

  if(dentroEquipos.length){
    estado.className='estado danger';
    estado.textContent='PELIGRO - ZONA DE MAQUINARIAS';
    detalle.textContent='Estás dentro de la zona de maquinarias: '+dentroEquipos.join(', ')+'. Retírate del área.';
    alarma('equipos');
  }else if(dentroPersonal.length){
    estado.className='estado danger';
    estado.textContent='PELIGRO - ZONA DE PERSONAL';
    detalle.textContent='Estás dentro de la zona de personal: '+dentroPersonal.join(', ')+'.';
    alarma('personal');
  }else if(cercaPersonal.distancia<=50){
    estado.className='estado warn';
    estado.textContent='ALERTA DE PROXIMIDAD';
    detalle.textContent='Estás a '+Math.round(cercaPersonal.distancia)+' m del perímetro de la zona de personal '+cercaPersonal.nombre+'.';
    alarma('proximidad');
  }else{
    estado.className='estado ok';
    estado.textContent='FUERA DE ZONA';
    detalle.textContent='Estás fuera de la zona de riesgo.';
    alarmaZona='';
  }
}

function usarGPS(){
  prepararAudio();

  // Si ya está siguiendo el GPS, el botón sirve para volver a centrar el mapa.
  if(watchId!==null){
    if(ultimaPosicion) map.setView(ultimaPosicion,17);
    return;
  }

  if(!navigator.geolocation){
    alert('Tu navegador no soporta GPS.');
    return;
  }

  watchId=navigator.geolocation.watchPosition(
    pos=>actualizar(pos.coords.latitude,pos.coords.longitude),
    err=>alert('No se pudo obtener GPS. Revisa permisos y que estés usando HTTPS.'),
    {enableHighAccuracy:true,maximumAge:0,timeout:10000}
  );
}

function probarDentro(){
  prepararAudio();
  const p=zonas.CV8.equipos[0];
  // Aproximación al centro mediante promedio de vértices para prueba visual.
  const poly=zonas.CV8.equipos;
  const lat=poly.reduce((s,v)=>s+v[0],0)/poly.length;
  const lon=poly.reduce((s,v)=>s+v[1],0)/poly.length;
  actualizar(lat,lon,true);
}
</script>

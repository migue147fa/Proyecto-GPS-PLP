 document.getElementById('coords').textContent='Lat: '+lat.toFixed(7)+' | Lon: '+lon.toFixed(7);
 document.getElementById('distEquipos').textContent='Distancia al límite de maquinarias: '+Math.round(distanciaAConjunto(p,z.equipos))+' m';
 document.getElementById('distPersonal').textContent='Distancia al límite de personal: '+Math.round(distanciaAConjunto(p,z.personal))+' m';
 const est=document.getElementById('estado'),det=document.getElementById('detalle');
 if(inEq){est.className='estado danger';est.textContent='PELIGRO - RADIO DE MAQUINARIAS';det.textContent='Te encuentras dentro del radio de maquinarias CV8.';sonar('equipos')}
 else if(inPe){est.className='estado warn';est.textContent='ALERTA - RADIO DE PERSONAL';det.textContent='Te encuentras dentro del radio de personal CV8.';sonar('personal')}
 else{est.className='estado ok';est.textContent='FUERA DE ZONA';det.textContent='Estás fuera de los radios de CV8.';ultimaZona=''}
}
function usarGPS(){
 if(!navigator.geolocation){alert('Tu navegador no soporta geolocalización.');return}
 if(watchId!==null)navigator.geolocation.clearWatch(watchId);
 watchId=navigator.geolocation.watchPosition(
   pos=>{actualizar(pos.coords.latitude,pos.coords.longitude);map.setView([pos.coords.latitude,pos.coords.longitude],17)},
   ()=>alert('No se pudo obtener el GPS. Revisa permisos de ubicación y que la página use HTTPS.'),
   {enableHighAccuracy:true,maximumAge:0,timeout:15000}
 );
}
function centroid(poly){let lat=0,lon=0;for(const p of poly){lat+=p[0];lon+=p[1]}return[lat/poly.length,lon/poly.length]}
function probarDentro(){const p=centroid(z.equipos[0]);actualizar(p[0],p[1]);map.setView(p,17)}
</script>
